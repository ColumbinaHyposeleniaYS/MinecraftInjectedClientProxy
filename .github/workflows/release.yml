name: Release

# Automatic releases:
#   - push a version tag:  git tag v1.0.0 && git push origin v1.0.0
#   - or run manually from the Actions tab and provide a tag
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v1.0.1 (created at the current commit if missing)'
        required: true
        default: 'v1.0.0'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build & publish (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Check out (full history for the changelog)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: tag
        shell: pwsh
        run: |
          $t = '${{ github.event_name }}' -eq 'workflow_dispatch' ? '${{ inputs.tag }}' : '${{ github.ref_name }}'
          $t = "$t".Trim()
          if ($t -notmatch '^v?[0-9]+(\.[0-9]+){0,3}(-[0-9A-Za-z.-]+)?$') {
            Write-Error "Invalid release tag '$t' (expected e.g. v1.0.0 or v1.0.0-beta.1)"
            exit 1
          }
          if (-not $t.StartsWith('v')) { $t = "v$t" }
          $isPre = ($t -match '-')
          "tag=$t" >> $env:GITHUB_OUTPUT
          "version=$($t.Substring(1))" >> $env:GITHUB_OUTPUT
          "prerelease=$($isPre ? 'true' : 'false')" >> $env:GITHUB_OUTPUT

      - name: Setup MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure (CMake)
        run: cmake -S . -B build "-DMICP_APP_VERSION=${{ steps.tag.outputs.version }}"

      - name: Build (Release)
        run: cmake --build build --config Release --parallel

      - name: Package portable bundle
        shell: pwsh
        run: |
          $app = 'MinecraftProxy'
          $tag = '${{ steps.tag.outputs.tag }}'
          $bundle = "package\$app"
          New-Item -ItemType Directory -Force -Path $bundle | Out-Null
          Copy-Item "build\bin\Release\$app.exe" -Destination $bundle
          Copy-Item README.md -Destination $bundle
          # Proxy core: a repository-root Aurora.dll overrides the built one
          # (drop in a custom build to ship it instead); otherwise the DLL
          # just built from proxy/ is bundled. CI is MSVC, so it must exist.
          $bundledDll = $false
          $dll = $null
          if (Test-Path "Aurora.dll" -PathType Leaf) {
            $dll = "Aurora.dll"
            Write-Host "Bundling Aurora.dll override from the repository root."
          } elseif (Test-Path "build\bin\Release\Aurora.dll" -PathType Leaf) {
            $dll = "build\bin\Release\Aurora.dll"
            Write-Host "Bundling Aurora.dll built from proxy/ sources."
          }
          if ($dll) {
            Copy-Item $dll -Destination $bundle
            $bundledDll = $true
          } else {
            Write-Warning "Aurora.dll not found - shipping the GUI only."
          }
          "bundledDll=$($bundledDll ? 'true' : 'false')" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $zipName = "$app-$tag-win64.zip"
          $zip = "dist\$zipName"
          Compress-Archive -Path $bundle -DestinationPath $zip -Force
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash
          "$hash  $zipName" | Out-File -FilePath dist\checksums.sha256 -Encoding ascii
          Get-ChildItem dist
          "zip=$zip" >> $env:GITHUB_ENV

      - name: Compose release notes
        shell: pwsh
        run: |
          # git emits UTF-8; make PowerShell decode it correctly (Chinese commit messages)
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new()
          $tag = '${{ steps.tag.outputs.tag }}'
          $sha = '${{ github.sha }}'.Substring(0, 8)
          $prev = git describe --tags --abbrev=0 HEAD^ 2>$null
          if ($LASTEXITCODE -ne 0 -or -not $prev) { $prev = $null }
          if ($prev) {
            Write-Host "Changelog range: $prev..HEAD"
            $commits = git log "$prev..HEAD" --no-merges --pretty=format:'- %s (%h)'
          } else {
            $commits = git log -20 --no-merges --pretty=format:'- %s (%h)'
          }
          $changelog = (@($commits) | Select-Object -First 40) -join "`n"
          if (-not $changelog) { $changelog = '- 初始发布' }
          $dllNote = if ('${{ env.bundledDll }}' -eq 'true') {
            '- `Aurora.dll`（代理核心）已随包附带，与程序同目录即可直接注入（程序本身也已内置代理核心）'
          } else {
            '- ℹ️ 代理核心 `Aurora.dll` 已内置在程序中，注入时自动使用；如需外部 DLL 请自行构建并放到程序同目录'
          }
          # NOTE: the here-string body below sits at the script's column 0 after
          # YAML strips the common indentation - required by PowerShell syntax.
          $template = @'
          ## 下载

          | 文件 | 说明 |
          | --- | --- |
          | `MinecraftProxy-__TAG__-win64.zip` | Windows x64 便携版，解压即用（GUI 单 exe + `Aurora.dll` 代理核心，无任何运行时依赖） |
          | `checksums.sha256` | SHA-256 校验和 |

          ## 更新内容 __TAG__

          __CHANGELOG__

          ## 运行要求

          - Windows 10 / 11（x64）
          - 无需安装任何运行库：本程序为纯 Win32 实现，不依赖 Qt / .NET / VC++ Redist
          __DLLNOTE__

          ## 快速上手

          1. 解压到任意目录，运行 `MinecraftProxy.exe`
          2. 启动 A 客户端并进入目标服务器
          3. 在「注入」页点击「开始注入」（默认匹配标题含「布吉岛」的 Java 窗口，可修改）
          4. B 客户端使用「直接连接」访问 `127.0.0.1:25565`

          完整说明见压缩包内的 `README.md`。仅供学习交流使用，请遵守所玩服务器的规则。

          > 构建信息：`__TAG__` @ `__SHA__` · MSVC x64 · Win32/GDI+ GUI + Aurora 代理核心
          '@
          $notes = $template.Replace('__TAG__', $tag).Replace('__SHA__', $sha).Replace('__CHANGELOG__', $changelog).Replace('__DLLNOTE__', $dllNote)
          $notes | Out-File -FilePath release-notes.md -Encoding utf8
          Get-Content release-notes.md

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ steps.tag.outputs.tag }}'
          $zip = $env:zip
          $sums = 'dist\checksums.sha256'
          $title = "MinecraftProxy $tag"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; re-uploading assets."
            gh release upload $tag $zip $sums --clobber
            if ($LASTEXITCODE -ne 0) { exit 1 }
            gh release edit $tag --title $title --notes-file release-notes.md
            if ($LASTEXITCODE -ne 0) { exit 1 }
          } else {
            $ghArgs = @('release', 'create', $tag, $zip, $sums, '--title', $title, '--notes-file', 'release-notes.md')
            if ('${{ steps.tag.outputs.prerelease }}' -eq 'true') { $ghArgs += '--prerelease' }
            if (-not (git tag --list $tag)) { $ghArgs += @('--target', '${{ github.sha }}') }
            gh @ghArgs
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
