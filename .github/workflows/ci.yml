name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '.clang-format'
      - '.editorconfig'
      - '.gitignore'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '.clang-format'
      - '.editorconfig'
      - '.gitignore'
  workflow_dispatch:

# Cancel superseded runs on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: Build (Windows x64, MSVC, no dependencies)
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Setup MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure (CMake)
        run: cmake -S . -B build

      - name: Build (Release)
        run: cmake --build build --config Release --parallel

      - name: Package portable bundle
        shell: pwsh
        run: |
          $app = 'MinecraftInjectedClientProxy'
          $bundle = "package\$app"
          New-Item -ItemType Directory -Force -Path $bundle | Out-Null
          Copy-Item "build\bin\Release\$app.exe" -Destination $bundle
          Copy-Item README.md -Destination $bundle
          # Proxy core: a repository-root Aurora.dll overrides the built one
          # (drop in a custom build to ship it instead); otherwise the DLL
          # just built from proxy/ is bundled. CI is MSVC, so it must exist.
          $dll = $null
          if (Test-Path "Aurora.dll" -PathType Leaf) {
            $dll = "Aurora.dll"
            Write-Host "Bundling Aurora.dll override from the repository root."
          } elseif (Test-Path "build\bin\Release\Aurora.dll" -PathType Leaf) {
            $dll = "build\bin\Release\Aurora.dll"
            Write-Host "Bundling Aurora.dll built from proxy/ sources."
          }
          if ($dll) {
            Copy-Item $dll -Destination $bundle
          } else {
            Write-Error "Aurora.dll not found: the aurora target did not build (MSVC required)."
            exit 1
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path $bundle -DestinationPath "dist\$app-win64-r$($env:GITHUB_RUN_NUMBER).zip" -Force
          Get-ChildItem dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MinecraftInjectedClientProxy-win64-r${{ github.run_number }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
