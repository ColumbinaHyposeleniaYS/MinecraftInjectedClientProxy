name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '.clang-format'
      - '.editorconfig'
      - '.gitignore'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '.clang-format'
      - '.editorconfig'
      - '.gitignore'
  workflow_dispatch:

# Cancel superseded runs on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: Build (Windows x64, MSVC, no dependencies)
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Setup MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure (CMake)
        run: cmake -S . -B build

      - name: Build (Release)
        run: cmake --build build --config Release --parallel

      - name: Package portable bundle
        shell: pwsh
        run: |
          $app = 'MinecraftInjectedClientProxy'
          $bundle = "package\$app"
          New-Item -ItemType Directory -Force -Path $bundle | Out-Null
          Copy-Item "build\bin\Release\$app.exe" -Destination $bundle
          Copy-Item README.md -Destination $bundle
          # If the repository ships a prebuilt proxy DLL, bundle it too.
          if (Test-Path "Aurora.dll" -PathType Leaf) {
            Copy-Item "Aurora.dll" -Destination $bundle
            Write-Host "Bundled Aurora.dll from the repository root."
          } else {
            Write-Host "No Aurora.dll in the repository root - release ships the GUI only."
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path $bundle -DestinationPath "dist\$app-win64-r$($env:GITHUB_RUN_NUMBER).zip" -Force
          Get-ChildItem dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MinecraftInjectedClientProxy-win64-r${{ github.run_number }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
